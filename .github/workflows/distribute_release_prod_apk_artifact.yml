name: Distribute release prod APK as artifact

on:
  workflow_dispatch:

jobs:
  distribute_release_build:
    runs-on: macos-latest
    env:
      NOTES_STORE_PASSWORD: '${{ secrets.NOTES_STORE_PASSWORD }}'
      NOTES_KEY_PASSWORD: '${{ secrets.NOTES_KEY_PASSWORD }}'

    steps:
      - uses: actions/checkout@v6
      - name: Prepare environment
        run: |
          export GRADLE_USER_HOME=`pwd`/.gradle
          chmod +x ./gradlew

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Assemble
        run: ./gradlew assembleProdRelease --stacktrace

      - name: Upload to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: composeApp-prod-release.apk
          path: composeApp/build/outputs/apk/prod/release/